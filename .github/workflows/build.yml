name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev expect
        pip install --upgrade pip setuptools "buildozer>=1.5.0" cython

    - name: Build APK with Buildozer
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer -v android debug

    - name: Check APK location
      run: |
        mkdir -p output_apk
        find . -name "*.apk" -exec cp {} output_apk/ \;
        ls -la output_apk/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LongStock-APK
        path: output_apk/*.apk
        if-no-files-found: error
