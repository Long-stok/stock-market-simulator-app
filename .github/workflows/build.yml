name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools
          pip install buildozer "cython==0.29.36"

      - name: Auto Accept Licenses & Build APK
        run: |
          # Tạo trước thư mục license để bypass toàn bộ câu hỏi tương tác CLI
          mkdir -p ~/.android/licenses
          echo -e "\n8933b5ace70847e0928340e683e5187745794393\nd56f518e5d3c7109293a1fdce435051801e1a221\n732d2e72e8f720019ec0d4a3162019f2413a4996" > ~/.android/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license

          # Chạy build trực tiếp
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LongStock-APK
          path: bin/*.apk
          if-no-files-found: error
